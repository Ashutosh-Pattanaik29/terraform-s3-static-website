<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 2 - S3 Static Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

        p { color: #4a5568; font-size: 1.1rem; }

<body>
    <div class="box">
        <h1>Static Website Hosted on Amazon S3</h1>

    </div>

</html>
